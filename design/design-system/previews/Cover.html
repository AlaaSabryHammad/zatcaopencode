<meta charset="utf-8">
<title>ZatcaWeb</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-canvas); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; }
  .palm { fill:var(--brand-600); }
  .deep { fill:var(--brand-900); }
  .tint { fill:var(--brand-200); }
  .dune { fill:var(--accent-500); }
  .blk { rx:var(--radius-xl); }
  .mod { fill:var(--brand-500); }
  .q { rx:var(--radius-xs); }
  .pix { fill:var(--accent-500); }
  .q2 { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.92; font-weight:650; letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 3px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>

<div class="cover">
