<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../components/lib/react.production.min.js"></script><script src="../components/lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><meta charset="utf-8"><title>Accordion — preview</title>
<style>html,body{margin:0}body{background:var(--bg-canvas);color:var(--ink);font-family:var(--font-sans);padding:20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.lbl{font:600 11px/16px var(--font-sans);color:var(--ink-muted);letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px}.panel{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:16px}.stage{position:relative;overflow:hidden;border-radius:var(--radius-lg);border:1px solid var(--border-default);background:var(--bg-canvas)}</style></head>
<body>
<div id="root"></div>
<script>
var Z = window.ZatcaWeb, h = React.createElement, F = React.Fragment, useState = React.useState;
function AR(c){ return h(Z.LocaleProvider, { lang: 'ar' }, c); }
function EN(c){ return h(Z.LocaleProvider, { lang: 'en' }, c); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Z.Accordion, { defaultOpen: ['qr'], items: [
  { id: 'qr', icon: 'qr-code', title: 'What does the QR code on an invoice contain?', content: 'For simplified tax invoices, the QR carries the seller name, VAT number, timestamp, invoice total and VAT total, plus cryptographic fields once your device is onboarded. ZatcaWeb only shows the QR after the invoice is issued and validated.' },
  { id: 'multi', icon: 'building-2', title: 'Can I manage several establishments?', subtitle: 'Organizations & workspaces', content: 'Yes — each organization gets an isolated workspace. Switch between them from the organization switcher.' },
  { id: 'export', icon: 'download', title: 'How do I export my data?', content: 'Settings → Data & Privacy → Export. Choose Excel, CSV or PDF.' }] }));
</script>
</body>
</html>
