<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../components/lib/react.production.min.js"></script><script src="../components/lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><meta charset="utf-8"><title>Icon — preview</title>
<style>html,body{margin:0}body{background:var(--bg-canvas);color:var(--ink);font-family:var(--font-sans);padding:20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.lbl{font:600 11px/16px var(--font-sans);color:var(--ink-muted);letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px}.panel{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:16px}.stage{position:relative;overflow:hidden;border-radius:var(--radius-lg);border:1px solid var(--border-default);background:var(--bg-canvas)}</style></head>
<body>
<div id="root"></div>
<script>
var Z = window.ZatcaWeb, h = React.createElement, F = React.Fragment, useState = React.useState;
function AR(c){ return h(Z.LocaleProvider, { lang: 'ar' }, c); }
function EN(c){ return h(Z.LocaleProvider, { lang: 'en' }, c); }
var names = ['layout-dashboard','receipt','file-text','users','truck','package','wallet','credit-card','landmark','chart-column','calculator','shield-check','building-2','qr-code','scan-line','sparkles','bell','settings','search','plus','send','printer','download','share-2','message-circle','calendar','clock','circle-check','circle-alert','triangle-alert','languages','command','workflow','banknote','percent','store'];
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' },
  h('div', { className: 'panel', style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(44px, 1fr))', gap: 8, color: 'var(--ink-secondary)' } },
    names.map(function (n) { return h('span', { key: n, title: n, style: { display: 'grid', placeItems: 'center', height: 40, borderRadius: 8 } }, h(Z.Icon, { name: n, size: 20 })); })),
  h('div', { className: 'row' }, EN(h('span', { className: 'row' }, h(Z.Icon, { name: 'arrow-right' }), h(Z.Icon, { name: 'chevron-right' }), h('span', { style: { fontSize: 12, color: 'var(--ink-muted)' } }, 'LTR'))),
    AR(h('span', { className: 'row' }, h(Z.Icon, { name: 'arrow-right' }), h(Z.Icon, { name: 'chevron-right' }), h('span', { style: { fontSize: 12, color: 'var(--ink-muted)' } }, 'RTL — directional icons mirror'))))));
</script>
</body>
</html>
