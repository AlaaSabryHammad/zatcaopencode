<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard (tablet) — ZatcaWeb</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zatcaweb/tokens.css">
<link rel="stylesheet" href="ds/zatcaweb/components/bundle.css">
<script src="ds/zatcaweb/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--bg-canvas)}
a{color:var(--ink-brand)}a:hover{color:var(--brand-700)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 834px; height: 1194px; overflow: hidden; display: flex; background: var(--bg-canvas); color: var(--ink); font-family: var(--font-sans);">
  <div style="display: flex; background: var(--bg-sunken); border-inline-end: 1px solid var(--border-default);">
    <x-import component-from-global-scope="ZatcaWeb.Sidebar" sections="{{nav}}" active="dash" collapsed="{{yes}}" orgs="{{orgs}}" current-org="o1"></x-import>
  </div>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <header style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 20px; border-bottom: 1px solid var(--border-default); background: var(--bg-surface);">
      <span style="font-weight: 650; font-size: 16px; flex: 1;">Dashboard</span>
      <x-import component-from-global-scope="ZatcaWeb.IconButton" icon="search" label="Search" variant="secondary"></x-import>
      <x-import component-from-global-scope="ZatcaWeb.IconButton" icon="bell" label="Notifications" badge="{{n3}}"></x-import>
      <x-import component-from-global-scope="ZatcaWeb.Button" icon-start="plus" size="sm">Create</x-import>
    </header>
    <main style="flex: 1; overflow: hidden; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 12px; color: var(--ink-muted);">Wed, 7 Oct 2026</span><h1 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 650;">Good morning, Faisal</h1></div>
        <x-import component-from-global-scope="ZatcaWeb.SegmentedControl" options="{{periods}}" default-value="month" size="sm" label="Period"></x-import>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <x-import component-from-global-scope="ZatcaWeb.StatCard" emphasis="{{yes}}" icon="chart-column" label="Total sales" value="{{k.sales}}" delta="{{d12}}" trend="{{k.trend}}"></x-import>
        <x-import component-from-global-scope="ZatcaWeb.StatCard" icon="percent" tone="accent" label="VAT collected" value="{{k.vat}}" delta="{{d98}}"></x-import>
        <x-import component-from-global-scope="ZatcaWeb.StatCard" icon="clock" tone="warning" label="Outstanding" value="{{k.out}}" delta="{{d18}}" invert="{{yes}}"></x-import>
        <x-import component-from-global-scope="ZatcaWeb.StatCard" icon="trending-up" tone="info" label="Net profit" value="{{k.profit}}" delta="{{d71}}"></x-import>
      </div>
      <x-import component-from-global-scope="ZatcaWeb.Insight" kicker="Smart insight">Outstanding invoices are up <strong>18%</strong> on last month — 4 are overdue.</x-import>
      <section style="padding: 20px; border-radius: var(--radius-lg); background: var(--bg-surface); border: 1px solid var(--border-default);">
        <x-import component-from-global-scope="ZatcaWeb.Chart" type="bar" title="Revenue vs expenses" subtitle="Last 6 months · SAR" data="{{months}}" series="{{series}}" format="currency" height="{{n200}}"></x-import>
      </section>
      <section style="border-radius: var(--radius-lg); background: var(--bg-surface); border: 1px solid var(--border-default); overflow: hidden;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;"><h2 style="margin: 0; font-size: 14px; font-weight: 600;">Recent invoices</h2><a href="Invoices.dc.html" style="font-size: 13px;">All</a></div>
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border-subtle);">
            <x-import component-from-global-scope="ZatcaWeb.Avatar" name="{{r.customer}}" size="sm" square="{{yes}}"></x-import>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.customer}}</span><span style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);">{{r.no}}</span></span>
            <x-import component-from-global-scope="ZatcaWeb.InvoiceStatus" status="{{r.status}}" size="sm"></x-import>
            <span style="width: 110px; text-align: end;"><x-import component-from-global-scope="ZatcaWeb.Amount" value="{{r.total}}" size="sm"></x-import></span>
          </div>
        </sc-for>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      yes: true, n3: 3, n200: 200, d12: 12.4, d98: 9.8, d18: 18, d71: 7.1,
      nav: [
        { items: [{ id: 'dash', label: 'Dashboard', icon: 'layout-dashboard' }] },
        { heading: 'Sales', items: [{ id: 'invoices', label: 'Invoices', icon: 'receipt' }, { id: 'customers', label: 'Customers', icon: 'users' }, { id: 'payments', label: 'Payments', icon: 'wallet' }] },
        { heading: 'Purchases', items: [{ id: 'expenses', label: 'Expenses', icon: 'banknote' }, { id: 'products', label: 'Products', icon: 'package' }] },
        { heading: 'Finance', items: [{ id: 'reports', label: 'Reports', icon: 'chart-column' }, { id: 'vat', label: 'VAT Center', icon: 'percent' }, { id: 'einv', label: 'E-Invoicing', icon: 'shield-check' }] },
        { heading: 'Workspace', items: [{ id: 'settings', label: 'Settings', icon: 'settings' }] }
      ],
      orgs: [{ id: 'o1', name: 'شركة آفاق التقنية المحدودة', vat: '310123456700003', role: 'Owner', plan: 'Business' }],
      periods: [{ value: 'week', label: 'Week' }, { value: 'month', label: 'Month' }, { value: 'quarter', label: 'Quarter' }],
      k: { sales: 248930.5, trend: [120, 132, 128, 150, 162, 158, 181, 197], vat: 37339.58, out: 95450, profit: 115130.5 },
      months: [['May', 158, 104], ['Jun', 151, 112], ['Jul', 176, 109], ['Aug', 169, 121], ['Sep', 192, 118], ['Oct', 248.93, 126.48]].map(function (m) { return { label: m[0], revenue: Math.round(m[1] * 1000), expenses: Math.round(m[2] * 1000) }; }),
      series: [{ key: 'revenue', label: 'Revenue' }, { key: 'expenses', label: 'Expenses', color: 'chart-3' }],
      recent: [
        { no: 'INV-2026-00126', customer: 'شركة الخليج للخدمات', status: 'sent', total: 13200 },
        { no: 'INV-2026-00125', customer: 'مؤسسة النور التجارية', status: 'partially_paid', total: 8625 },
        { no: 'INV-2026-00124', customer: 'شركة البناء الحديث', status: 'paid', total: 48300 },
        { no: 'INV-2026-00123', customer: 'Al Waha Hospitality Co.', status: 'overdue', total: 3105 },
        { no: 'INV-2026-00122', customer: 'شركة البناء الحديث', status: 'viewed', total: 21850 }
      ]
    };
  }
}
</script>
</body>
</html>
