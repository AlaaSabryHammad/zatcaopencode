<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الرئيسية — ZatcaWeb للجوال</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zatcaweb/tokens.css">
<link rel="stylesheet" href="ds/zatcaweb/components/bundle.css">
<script src="ds/zatcaweb/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--bg-canvas)}
a{color:var(--ink-brand)}
</style>
</helmet>
<div data-theme="{{theme}}" dir="rtl" lang="ar" style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--ink); font-family: var(--font-arabic);">
<x-import component-from-global-scope="ZatcaWeb.LocaleProvider" lang="ar">
<div style="height: 844px; display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 12px;">
    <x-import component-from-global-scope="ZatcaWeb.Avatar" name="شركة آفاق التقنية" size="md" square="{{yes}}"></x-import>
    <div style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 13px; color: var(--ink-muted);">صباح الخير</span><span style="font-size: 18px; font-weight: 700;">فيصل العتيبي</span></div>
    <x-import component-from-global-scope="ZatcaWeb.IconButton" icon="search" label="بحث" variant="secondary"></x-import>
    <x-import component-from-global-scope="ZatcaWeb.IconButton" icon="bell" label="الإشعارات" badge="{{n3}}"></x-import>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px;">
    <section style="position: relative; overflow: hidden; padding: 18px; border-radius: var(--radius-xl); background: var(--brand-900); color: var(--on-brand-deep); display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 14px; opacity: 0.85;">مبيعات أكتوبر</span><span dir="ltr" style="font-family: var(--font-sans); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-sm); background: rgba(255, 255, 255, 0.12);">+12.4%</span></div>
      <span dir="ltr" style="font-family: var(--font-sans); font-size: 32px; line-height: 38px; font-weight: 650; letter-spacing: -0.02em; text-align: end; font-variant-numeric: tabular-nums;">248,930.50 <span style="font-size: 14px; opacity: 0.8;">ر.س</span></span>
      <div style="display: flex; gap: 16px; font-size: 13px; opacity: 0.9;"><span>الضريبة: <span dir="ltr" style="font-family: var(--font-sans);">37,339.58</span></span><span>المستحق: <span dir="ltr" style="font-family: var(--font-sans);">95,450.00</span></span></div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
        <a href="{{a.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px; border-radius: var(--radius-lg); background: var(--bg-surface); border: 1px solid var(--border-default); text-decoration: none; color: var(--ink); font-size: 12px; font-weight: 600; text-align: center;"><span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--brand-100); color: var(--ink-brand);"><x-import component-from-global-scope="ZatcaWeb.Icon" name="{{a.icon}}" size="{{n20}}"></x-import></span>{{a.label}}</a>
      </sc-for>
    </div>

    <a href="Invoices.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--radius-lg); background: var(--danger-bg); color: var(--danger-fg); text-decoration: none;">
      <x-import component-from-global-scope="ZatcaWeb.Icon" name="circle-alert" size="{{n20}}"></x-import>
      <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 700; font-size: 14px;">٤ فواتير متأخرة</span><span style="font-size: 13px;">بإجمالي <span dir="ltr" style="font-family: var(--font-sans);">31,200.00</span> ر.س · أرسل تذكيرًا</span></span>
      <x-import component-from-global-scope="ZatcaWeb.Icon" name="chevron-right" size="{{n18}}"></x-import>
    </a>

    <section style="border-radius: var(--radius-lg); background: var(--bg-surface); border: 1px solid var(--border-default); overflow: hidden;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;"><h2 style="margin: 0; font-size: 15px; font-weight: 700;">أحدث الفواتير</h2><a href="Invoices.dc.html" style="font-size: 13px;">عرض الكل</a></div>
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--border-subtle);">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.customer}}</span><span dir="ltr" style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); text-align: end;">{{r.no}}</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;"><x-import component-from-global-scope="ZatcaWeb.Amount" value="{{r.total}}" size="sm"></x-import><x-import component-from-global-scope="ZatcaWeb.InvoiceStatus" status="{{r.status}}" size="sm"></x-import></span>
        </div>
      </sc-for>
    </section>
  </main>

  <nav aria-label="التنقل الرئيسي" style="display: flex; align-items: center; justify-content: space-around; height: 76px; padding: 0 8px 12px; border-top: 1px solid var(--border-default); background: var(--bg-surface);">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" aria-label="{{t.label}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; text-decoration: none; color: {{t.color}}; font-size: 11px; font-weight: 600;">
        <span style="display: grid; place-items: center; width: {{t.size}}; height: {{t.size}}; border-radius: var(--radius-full); background: {{t.bg}}; color: {{t.iconColor}};"><x-import component-from-global-scope="ZatcaWeb.Icon" name="{{t.icon}}" size="{{n22}}"></x-import></span>{{t.text}}
      </a>
    </sc-for>
  </nav>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var tab = function (icon, text, href, on, primary) { return { icon: icon, text: primary ? '' : text, label: text, href: href, color: on ? 'var(--ink-brand)' : 'var(--ink-muted)', size: primary ? '52px' : '32px', bg: primary ? 'var(--brand-600)' : 'transparent', iconColor: primary ? 'var(--on-brand)' : 'inherit' }; };
    return {
      theme: this.props.theme ?? 'light',
      yes: true, n3: 3, n18: 18, n20: 20, n22: 22,
      actions: [
        { icon: 'receipt', label: 'فاتورة جديدة', href: 'MobileInvoice.dc.html' },
        { icon: 'user-plus', label: 'عميل جديد', href: '#customer' },
        { icon: 'banknote', label: 'مصروف', href: '#expense' },
        { icon: 'scan-line', label: 'مسح إيصال', href: '#scan' }
      ],
      recent: [
        { no: 'INV-2026-00126', customer: 'شركة الخليج للخدمات', status: 'sent', total: 13200 },
        { no: 'INV-2026-00125', customer: 'مؤسسة النور التجارية', status: 'partially_paid', total: 8625 },
        { no: 'INV-2026-00124', customer: 'شركة البناء الحديث', status: 'paid', total: 48300 },
        { no: 'INV-2026-00123', customer: 'شركة الواحة للضيافة', status: 'overdue', total: 3105 }
      ],
      tabs: [tab('layout-dashboard', 'الرئيسية', '#home', true), tab('receipt', 'الفواتير', 'Invoices.dc.html', false), tab('plus', 'إنشاء', 'MobileInvoice.dc.html', false, true), tab('chart-column', 'التقارير', 'Reports.dc.html', false), tab('ellipsis', 'المزيد', '#more', false)]
    };
  }
}
</script>
</body>
</html>
